<header id="topbar">
  <div class="brand">Random<span>Engine</span></div>
  <div class="tagline">advanced dice notation</div>
  <div class="spacer"></div>
  <button class="tb" id="btnSave" title="Save the current expression under its # name">Save</button>
  <button class="tb" id="btnLink" title="Copy a link to this expression">Copy link</button>
</header>

<div id="app">

  <!-- On a wide screen the reference lives here, permanently open. Below the
       breakpoint it moves into the tool drawer as a tab. -->
  <aside id="sidebar">
    <div class="panehead"><span class="ttl">Reference</span></div>
    <div class="sidebody" id="refSide"></div>
  </aside>

  <div id="main">

  <!-- ------------------------------------------------------ expression -->
  <section class="pane" id="paneExpr">
    <div class="panehead">
      <span class="ttl">Expression</span>
      <button class="roll sec" id="btnUndo" title="Undo">undo<kbd class="onpc">Ctrl Z</kbd><kbd class="onphone">&#8630;</kbd></button>
      <button class="roll sec" id="btnRedo" title="Redo">redo<kbd class="onpc">Ctrl Y</kbd><kbd class="onphone">&#8631;</kbd></button>
      <span class="spacer"></span>
      <span class="notation" id="notation"></span>
      <button class="roll" id="rollBtn">Roll<kbd class="onpc">&crarr;</kbd><span class="onphone rolldie"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><use href="#sh-d6"/></svg></span></button>
    </div>
    <!-- what the expression would roll, by die name; updates as you type -->
    <div class="preview" id="preview"></div>
    <div class="editor" id="editorWrap">
      <pre class="hl" id="hl" aria-hidden="true"></pre>
      <textarea id="expr" rows="1" wrap="off" spellcheck="false" enterkeyhint="go"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                placeholder="4d6dl1 &nbsp; 2d20kh1+5 &nbsp; {2d6, 3d8}kh1 &nbsp; 10d10>=7f<=1 &nbsp; 6x 4d6dl1 # stats"></textarea>
    </div>
    <div class="status" id="status">&nbsp;</div>
    <div class="shortcuts" id="shortcuts"></div>
  </section>

  <!-- ---------------------------------------------------------- result -->
  <section class="pane grow" id="paneResult">
    <div class="panehead">
      <span class="ttl">Result</span>
      <span class="hint"><kbd>Enter</kbd> to roll &mdash; click an entry to open it</span>
      <span class="spacer"></span>
      <button class="mini" id="btnClear">clear</button>
    </div>
    <div class="resultbody" id="result"></div>
  </section>

  <!-- ----------------------------------------------------------- tools -->
  <section class="pane" id="paneTools">
    <div class="tabsrow">
      <div class="tabs" id="tabs">
        <button data-tab="reference">Reference</button>
        <button data-tab="explain" class="on">Explain</button>
        <button data-tab="details">Details</button>
        <button data-tab="vars">Variables</button>
        <button data-tab="saved">Saved</button>
        <button data-tab="setup">Preset</button>
      </div>
      <button class="drawer" id="drawerToggle" aria-label="Collapse panel" aria-expanded="true">&#9662;</button>
    </div>
    <div class="toolbody">
      <div class="tabpane" id="tab-reference"></div>
      <div class="tabpane on" id="tab-explain"></div>
      <div class="tabpane" id="tab-details"></div>
      <div class="tabpane" id="tab-vars"></div>
      <div class="tabpane" id="tab-saved"></div>
      <div class="tabpane" id="tab-setup"></div>
    </div>
  </section>

  </div>
</div>

<div id="toast"></div>

<script src="engine.js"></script>
<script src="presets.js"></script>
<script src="reference.js"></script>
<script src="app.js"></script>
</body>
</html>
