<header id="topbar">
  <div class="brand">Random<span>Engine</span></div>
  <div class="tagline">advanced dice notation, explained as you type</div>
  <div class="spacer"></div>
  <button class="tb" id="btnSave" title="Save the current expression">Save</button>
  <button class="tb" id="btnLink" title="Copy a link to this expression">Copy link</button>
</header>

<div id="app">

  <!-- ------------------------------------------------------ expression -->
  <section class="pane" id="paneExpr">
    <div class="panehead">
      <span class="ttl">Expression</span>
      <span class="spacer"></span>
      <span class="notation" id="notation"></span>
      <button class="roll" id="rollBtn">Roll<kbd>&crarr;</kbd></button>
    </div>
    <div class="editor" id="editorWrap">
      <pre class="hl" id="hl" aria-hidden="true"></pre>
      <textarea id="expr" rows="1" wrap="off" spellcheck="false" enterkeyhint="go"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                placeholder="4d6dl1 &nbsp; 2d20kh1+5 &nbsp; {2d6, 3d8}kh1 &nbsp; 10d10>=7f<=1 &nbsp; 6x 4d6dl1 # stats"></textarea>
    </div>
    <div class="status" id="status">&nbsp;</div>
  </section>

  <!-- ---------------------------------------------------------- result -->
  <section class="pane grow" id="paneResult">
    <div class="panehead">
      <span class="ttl">Result</span>
      <span class="hint">the top card re-rolls as you type &mdash; <kbd>Enter</kbd> keeps it and rolls again</span>
      <span class="spacer"></span>
      <button class="mini" id="btnClear">clear</button>
    </div>
    <div class="resultbody" id="result"></div>
  </section>

  <!-- ----------------------------------------------------------- tools -->
  <section class="pane" id="paneTools">
    <div class="tabsrow">
      <div class="tabs" id="tabs">
        <button data-tab="explain" class="on">Explain</button>
        <button data-tab="details">Details</button>
        <button data-tab="reference">Reference</button>
        <button data-tab="saved">Saved</button>
      </div>
      <button class="drawer" id="drawerToggle" aria-label="Collapse panel" aria-expanded="true">&#9662;</button>
    </div>
    <div class="toolbody">
      <div class="tabpane on" id="tab-explain"></div>
      <div class="tabpane" id="tab-details"></div>
      <div class="tabpane" id="tab-reference"></div>
      <div class="tabpane" id="tab-saved"></div>
    </div>
  </section>

</div>

<div id="toast"></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
