<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="color-scheme" content="dark">
<meta name="description" content="Advanced dice notation console — type an expression, see it explained and rolled live.">
<title>Random Engine — Dice Notation Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Die silhouettes, drawn once and referenced with <use>. Shapes carry no fill or
     stroke of their own so they inherit the per-state colours from CSS; interior
     edge lines opt out of the fill explicitly. 64x64 user units. -->
<svg id="dice-sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- coin -->
    <symbol id="sh-d2">
      <circle cx="32" cy="32" r="27"/>
      <circle cx="32" cy="32" r="20.5" fill="none" stroke-width="2" stroke-opacity=".65"/>
    </symbol>
    <!-- tetrahedron: the two visible edges converge below the digit -->
    <symbol id="sh-d4">
      <path d="M32 4 L58 52 L6 52 Z"/>
      <path d="M32 52 L20.5 30.5 M32 52 L43.5 30.5" fill="none" stroke-width="2" stroke-opacity=".7"/>
    </symbol>
    <!-- cube (also used for Fudge dice) -->
    <symbol id="sh-d6">
      <rect x="7" y="7" width="50" height="50" rx="10"/>
    </symbol>
    <!-- octahedron, seen edge-on: a diamond. Seams sit in the top half only,
         so the digit gets the clear lower face. -->
    <symbol id="sh-d8">
      <path d="M32 2 L59 32 L32 62 L5 32 Z"/>
      <path d="M5 32 L59 32 M32 2 L32 32" fill="none" stroke-width="2" stroke-opacity=".7"/>
    </symbol>
    <!-- pentagonal trapezohedron: kite-shaped front face -->
    <symbol id="sh-d10">
      <path d="M32 2 L59 23 L52 51 L32 62 L12 51 L5 23 Z"/>
      <path d="M32 9 L49 27 L32 52 L15 27 Z" fill="none" stroke-width="2" stroke-opacity=".7"/>
    </symbol>
    <!-- dodecahedron: pentagonal front face -->
    <symbol id="sh-d12">
      <path d="M32 3 L48 8 L58 21 L58 38 L48 52 L32 58 L16 52 L6 38 L6 21 L16 8 Z"/>
      <path d="M32 12 L51 26 L43.5 49 L20.5 49 L13 26 Z" fill="none" stroke-width="2" stroke-opacity=".7"/>
    </symbol>
    <!-- icosahedron: hexagonal outline, triangular front face -->
    <symbol id="sh-d20">
      <path d="M32 3 L57 17.5 L57 46.5 L32 61 L7 46.5 L7 17.5 Z"/>
      <path d="M50 19 L14 19 L32 51 Z" fill="none" stroke-width="2" stroke-opacity=".7"/>
      <path d="M50 19 L57 17.5 M14 19 L7 17.5 M32 51 L32 61" fill="none" stroke-width="2" stroke-opacity=".45"/>
    </symbol>
    <!-- zocchihedron: facets hug the rim so the three digits stay clear -->
    <symbol id="sh-d100">
      <circle cx="32" cy="32" r="27"/>
      <path d="M11 21 L20 26 L15 37 M53 21 L44 26 L49 37 M20 52 L26 45 M44 52 L38 45"
            fill="none" stroke-width="2" stroke-opacity=".6"/>
    </symbol>
    <!-- no standard solid for this size -->
    <symbol id="sh-gen">
      <path d="M21 6 L43 6 L58 21 L58 43 L43 58 L21 58 L6 43 L6 21 Z"/>
    </symbol>
  </defs>
</svg>

<header id="topbar">
  <div class="brand">Random<span>Engine</span></div>
  <div class="tagline">advanced dice notation, explained as you type</div>
  <div class="spacer"></div>
  <button class="tb" id="btnSave" title="Save the current expression">Save</button>
  <button class="tb" id="btnLink" title="Copy a link to this expression">Copy link</button>
</header>

<div id="app">

  <!-- ------------------------------------------------------ expression -->
  <section class="pane" id="paneExpr">
    <div class="panehead">
      <span class="ttl">Expression</span>
      <span class="spacer"></span>
      <span class="notation" id="notation"></span>
      <button class="roll" id="rollBtn">Roll<kbd>&crarr;</kbd></button>
    </div>
    <div class="editor" id="editorWrap">
      <pre class="hl" id="hl" aria-hidden="true"></pre>
      <textarea id="expr" rows="1" wrap="off" spellcheck="false" enterkeyhint="go"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                placeholder="4d6dl1 &nbsp; 2d20kh1+5 &nbsp; {2d6, 3d8}kh1 &nbsp; 10d10>=7f<=1 &nbsp; 6x 4d6dl1 # stats"></textarea>
    </div>
    <div class="status" id="status">&nbsp;</div>
  </section>

  <!-- ---------------------------------------------------------- result -->
  <section class="pane grow" id="paneResult">
    <div class="panehead">
      <span class="ttl">Result</span>
      <span class="hint">the top card re-rolls as you type &mdash; <kbd>Enter</kbd> keeps it and rolls again</span>
      <span class="spacer"></span>
      <button class="mini" id="btnClear">clear</button>
    </div>
    <div class="resultbody" id="result"></div>
  </section>

  <!-- ----------------------------------------------------------- tools -->
  <section class="pane" id="paneTools">
    <div class="tabsrow">
      <div class="tabs" id="tabs">
        <button data-tab="explain" class="on">Explain</button>
        <button data-tab="details">Details</button>
        <button data-tab="reference">Reference</button>
        <button data-tab="saved">Saved</button>
      </div>
      <button class="drawer" id="drawerToggle" aria-label="Collapse panel" aria-expanded="true">&#9662;</button>
    </div>
    <div class="toolbody">
      <div class="tabpane on" id="tab-explain"></div>
      <div class="tabpane" id="tab-details"></div>
      <div class="tabpane" id="tab-reference"></div>
      <div class="tabpane" id="tab-saved"></div>
    </div>
  </section>

</div>

<div id="toast"></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
